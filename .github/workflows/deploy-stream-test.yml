name: Deploy Stream Test Worker

on:
  push:
    branches:
      - stream-test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show worker files
        run: |
          pwd
          ls -la
          ls -la worker-stream-test
          cat worker-stream-test/wrangler.toml

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: deploy
          workingDirectory: worker-stream-test
